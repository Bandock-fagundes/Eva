<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png"><title>E.V.A. — Entrar</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#1a1640,#0b0d12 60%);
  color:#e8eaf0;font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
form{display:flex;flex-direction:column;gap:12px;width:min(340px,88vw);text-align:center}
img{width:96px;height:96px;margin:0 auto 4px;border-radius:26px;box-shadow:0 10px 40px rgba(139,124,255,.35)}
h1{margin:0;letter-spacing:6px;font-size:26px;background:linear-gradient(90deg,#b7adff,#5cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8b94a8;font-size:13px;margin:0 0 10px}
input{background:#151922;border:1px solid #252b3a;color:#fff;border-radius:14px;padding:15px;font-size:16px;outline:none}
input:focus{border-color:#8b7cff}
button{background:linear-gradient(135deg,#8b7cff,#6b5cf0);border:0;color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.erro{color:#ff8a96;margin:0;font-size:14px;min-height:20px}
</style></head>
<body>
<form id="f" method="post" action="/login">
  <img src="/icon-192.png" alt="">
  <h1>E.V.A.</h1>
  <p class="sub">Entidade Virtual Adaptativa · v1.0</p>
  <input type="password" name="senha" id="senha" placeholder="Senha" autocomplete="current-password" autofocus required>
  <button id="b">Entrar</button>
  <p class="erro" id="erro"></p>
</form>
<script>
const msg = {'1': 'Senha errada.', 'limite': 'Muitas tentativas. Espera uns minutos e tenta de novo.'};
const q = new URLSearchParams(location.search).get('erro');
if (q) document.getElementById('erro').textContent = msg[q] || 'Não deu pra entrar.';
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'); b.disabled = true; b.textContent = 'Entrando…';
  try {
    const r = await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({senha: document.getElementById('senha').value})});
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { location.href = '/'; return; }
    document.getElementById('erro').textContent = j.erro || 'Não deu pra entrar.';
  } catch (_) { document.getElementById('erro').textContent = 'Sem conexão com o servidor.'; }
  b.disabled = false; b.textContent = 'Entrar';
});
</script>
</body></html>
