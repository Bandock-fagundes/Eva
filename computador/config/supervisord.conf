; Processos do computador da Eva (tudo roda como o usuário "eva", menos o próprio supervisor)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Tela virtual + servidor VNC (só aceita conexões de dentro do container; a senha vem do .env)
[program:tela]
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_EVA_PC_RESOLUCAO)s -depth 24 -dpi 96 -rfbport 5901 -localhost=1
    -SecurityTypes VncAuth -rfbauth /home/eva/.vnc/passwd -AlwaysShared -AcceptSetDesktopSize=0
    -desktop "Computador da Eva"
user=eva
environment=HOME="/home/eva",USER="eva"
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Área de trabalho XFCE
[program:sessao]
command=/usr/local/bin/eva-sessao
user=eva
environment=HOME="/home/eva",USER="eva",DISPLAY=":1"
priority=20
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; noVNC (a tela no navegador) + ponte WebSocket -> VNC
[program:novnc]
command=/usr/bin/websockify --web /opt/novnc 6080 localhost:5901
user=eva
environment=HOME="/home/eva",USER="eva"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Agente do PC (a "mão" da Eva: print, mouse, teclado, comandos)
[program:agente]
command=/opt/agente/venv/bin/python /opt/agente/agente_pc.py
user=eva
directory=/home/eva
environment=HOME="/home/eva",USER="eva",DISPLAY=":1",EVA_PC_CASA="/home/eva"
priority=40
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
