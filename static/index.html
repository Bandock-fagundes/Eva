<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>E.V.A.</title>
<style>
  :root{--bg:#0d0f14;--card:#161a22;--line:#262c38;--txt:#e7e9ee;--mut:#8a93a6;--acc:#8b7cff;--red:#ff4d5e;--ok:#3ddc97;--warn:#ffb547}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;letter-spacing:3px}
  #dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  #status{color:var(--mut);font-size:12px}.sp{flex:1}
  #kill{background:var(--red);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}
  #kill.off{background:var(--ok);color:#000}
  main{flex:1;display:grid;grid-template-columns:1fr 420px;min-height:0}
  .view{min-height:0;display:flex;flex-direction:column}
  #chat{border-right:1px solid var(--line)}
  #msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:78%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
  .u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
  .e{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .s{align-self:center;color:var(--mut);font-size:12px;text-align:center}
  .ap{align-self:flex-start;background:#2a2312;border:1px solid var(--warn);padding:12px;border-radius:12px;max-width:90%}
  .ap pre{white-space:pre-wrap;font-size:12px;color:var(--mut);margin:6px 0;max-height:160px;overflow:auto}
  .ap button{margin-right:8px;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
  #typing{display:none;align-self:flex-start;color:var(--mut);font-size:13px}
  form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  textarea{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:11px;resize:none;font:inherit;height:46px;max-height:140px}
  form button{background:var(--acc);border:0;color:#fff;border-radius:14px;padding:0 18px;cursor:pointer;font-size:18px}
  #side{display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px;cursor:pointer;font-size:13px}
  .tabs button.on{color:var(--txt);border-bottom:2px solid var(--acc)}
  .pane{flex:1;overflow:auto;padding:12px;display:none;font-size:13px}.pane.on{display:block}
  .lg{border-bottom:1px solid var(--line);padding:6px 0}.lg b{color:var(--acc)}.lg span{color:var(--mut)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
  select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px}
  .mem{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}.mem button{background:none;border:0;color:var(--red);cursor:pointer;font-size:16px}
  #telaImg{width:100%;border-radius:10px;border:1px solid var(--line)}
  #persona{width:100%;height:60vh;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 monospace}
  .btn{background:var(--acc);border:0;color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;margin-top:8px}
  .hint{color:var(--mut)}
  nav{display:none}
  /* ===== CELULAR ===== */
  @media (max-width:820px){
    main{display:block;position:relative}
    #chat{border:0;height:100%}
    #side{position:absolute;inset:0;background:var(--bg);display:none}
    body.lado #side{display:flex}
    #side .tabs{display:none}
    .m{max-width:86%}
    nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--card)}
    nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
    nav button i{font-style:normal;font-size:19px}
    nav button.on{color:var(--acc)}
    #status{display:none}
  }
</style>
</head>
<body>
<header><div id="dot"></div><h1>E.V.A.</h1><span id="status"></span><div class="sp"></div><button id="kill">⏻ DESLIGAR</button></header>
<main>
  <section id="chat" class="view">
    <div id="msgs"><div id="typing">Eva está pensando…</div></div>
    <form id="f"><textarea id="t" placeholder="Fala com a Eva…"></textarea><button aria-label="Enviar">➤</button></form>
  </section>
  <section id="side" class="view">
    <div class="tabs">
      <button data-p="tela" class="on">Tela</button><button data-p="log">Registro</button>
      <button data-p="perm">Permissões</button><button data-p="mem">Memória</button><button data-p="eva">Eva</button>
    </div>
    <div id="tela" class="pane on"><p class="hint">O computador virtual da Eva. Quando ela navegar, a tela aparece aqui.</p><img id="telaImg" alt="" hidden></div>
    <div id="log" class="pane"></div>
    <div id="perm" class="pane"></div>
    <div id="mem" class="pane"></div>
    <div id="eva" class="pane"><p class="hint">Personalidade da Eva. Muda o jeito dela pensar e falar.</p><textarea id="persona"></textarea><button class="btn" id="salvarPersona">Salvar</button></div>
  </section>
</main>
<nav id="nav">
  <button data-p="chat" class="on"><i>💬</i>Chat</button><button data-p="tela"><i>🖥️</i>Tela</button>
  <button data-p="log"><i>📜</i>Registro</button><button data-p="perm"><i>🛡️</i>Controle</button>
  <button data-p="mem"><i>🧠</i>Memória</button><button data-p="eva"><i>✨</i>Eva</button>
</nav>
<script>
const $=s=>document.querySelector(s), msgs=$('#msgs'), typing=$('#typing');
let ws, desligada=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function add(cls,txt){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;msgs.insertBefore(d,typing);msgs.scrollTop=1e9;return d}
function conectar(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onclose=e=>{if(e.code===4401)location.href='/login';else setTimeout(conectar,2000)};
  ws.onmessage=e=>{const ev=JSON.parse(e.data);
    if(ev.tipo==='pensando')typing.style.display='block';
    else if(ev.tipo==='resposta'){add('e',ev.texto);notificar(ev.texto)}
    else if(ev.tipo==='erro')add('s','⚠ '+ev.texto);
    else if(ev.tipo==='acao')add('s',`🔧 ${ev.ferramenta}`);
    else if(ev.tipo==='tela')carregarTela();
    else if(ev.tipo==='aprovacao'){const d=document.createElement('div');d.className='ap';
      d.innerHTML=`<b>A Eva quer usar: ${esc(ev.ferramenta)}</b><pre></pre><button style="background:var(--ok)">Permitir</button><button style="background:var(--red);color:#fff">Negar</button>`;
      d.querySelector('pre').textContent=JSON.stringify(ev.args,null,2);
      const [s,n]=d.querySelectorAll('button');
      const r=ok=>{ws.send(JSON.stringify({tipo:'aprovacao',id:ev.id,aprovado:ok}));d.querySelectorAll('button').forEach(b=>b.remove());d.append(ok?'✅ permitido':'❌ negado')};
      s.onclick=()=>r(true);n.onclick=()=>r(false);msgs.insertBefore(d,typing);msgs.scrollTop=1e9;notificar('A Eva precisa da tua aprovação')}
    if(ev.tipo==='fim'){typing.style.display='none';carregarLog()}
  };
}
function notificar(t){if(document.hidden&&'Notification'in window&&Notification.permission==='granted')new Notification('E.V.A.',{body:t.slice(0,120),icon:'/icon-192.png'})}
$('#f').onsubmit=e=>{e.preventDefault();const t=$('#t').value.trim();if(!t)return;
  if(!ws||ws.readyState!==1){add('s','Reconectando… tenta de novo em 2s.');return}
  add('u',t);ws.send(JSON.stringify({tipo:'mensagem',texto:t}));$('#t').value='';
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()};
$('#t').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:821px)').matches){e.preventDefault();$('#f').requestSubmit()}};
const loaders={tela:carregarTela,log:carregarLog,perm:carregarPerm,mem:carregarMem,eva:carregarPersona};
function abrir(p){
  document.querySelectorAll('.tabs button,nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  if(p==='chat'){document.body.classList.remove('lado');return}
  document.body.classList.add('lado');
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===p));loaders[p]()}
document.querySelectorAll('.tabs button,nav button').forEach(b=>b.onclick=()=>abrir(b.dataset.p));
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login';throw 0}return r}
async function estado(){const s=await (await api('/api/estado')).json();desligada=s.desligada;$('#status').textContent=s.modelo;
  $('#kill').textContent=desligada?'⏻ LIGAR':'⏻ DESLIGAR';$('#kill').classList.toggle('off',desligada);
  $('#dot').style.background=desligada?'var(--red)':'var(--ok)';$('#dot').style.boxShadow='0 0 10px '+(desligada?'var(--red)':'var(--ok)')}
$('#kill').onclick=async()=>{if(!desligada&&!confirm('Desligar a Eva agora? Tudo que ela estiver fazendo para.'))return;
  await api(desligada?'/api/ligar':'/api/desligar',{method:'POST'});add('s',desligada?'Eva ligada.':'Eva DESLIGADA. Tudo parado.');estado();carregarLog()};
async function carregarTela(){const r=await api('/api/tela');if(r.status===200){const b=await r.blob();const i=$('#telaImg');i.src=URL.createObjectURL(b);i.hidden=false}}
async function carregarLog(){const l=await (await api('/api/log?n=150')).json();$('#log').innerHTML='';
  l.reverse().forEach(r=>{const d=document.createElement('div');d.className='lg';const {ts,tipo,...rest}=r;
  d.innerHTML=`<span>${esc(ts)}</span> <b>${esc(tipo)}</b><div></div>`;d.querySelector('div').textContent=JSON.stringify(rest).slice(0,300);$('#log').appendChild(d)})}
async function carregarPerm(){const p=await (await api('/api/permissoes')).json();$('#perm').innerHTML='<p class="hint">O que a Eva pode fazer sozinha, o que pergunta antes, e o que é proibido.</p>';
  for(const [k,v] of Object.entries(p)){const d=document.createElement('div');d.className='row';
  d.innerHTML=`<span>${esc(k.replace(/_/g,' '))}</span><select><option>permitir</option><option>perguntar</option><option>bloquear</option></select>`;
  const s=d.querySelector('select');s.value=v;s.onchange=()=>api('/api/permissoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ferramenta:k,valor:s.value})});$('#perm').appendChild(d)}}
async function carregarMem(){const m=await (await api('/api/memorias')).json();$('#mem').innerHTML=m.length?'':'<p class="hint">Ainda não lembro de nada. Conversa comigo!</p>';
  m.forEach(x=>{const d=document.createElement('div');d.className='mem';d.innerHTML=`<button title="apagar">✕</button><div><span class="hint">${esc(x.categoria)}</span> — </div>`;
  d.querySelector('div').append(x.conteudo);d.querySelector('button').onclick=async()=>{await api('/api/memorias/'+x.id,{method:'DELETE'});carregarMem()};$('#mem').appendChild(d)})}
async function carregarPersona(){const p=await (await api('/api/persona')).json();$('#persona').value=p.texto}
$('#salvarPersona').onclick=async()=>{await api('/api/persona',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:$('#persona').value})});add('s','Personalidade salva.')};
async function historico(){const h=await (await api('/api/historico')).json();
  if(!h.length)add('s','Oi, Gabriel. Tô aqui.');h.forEach(x=>add(x.papel==='user'?'u':'e',x.conteudo))}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
historico();conectar();estado();carregarTela();setInterval(estado,8000);
</script>
</body>
</html>
